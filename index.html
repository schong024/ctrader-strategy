<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>cTrader Account + Symbol Test</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            min-height: 100%;

            background: #1c1c1e;
            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            padding: 18px;

            font-size: 13px;
        }

        .panel {
            width: 100%;

            max-width: 520px;
        }

        h1 {
            margin: 0 0 16px;

            padding-bottom: 8px;

            border-bottom:
                1px solid #3a3a3c;

            color: #30d158;

            font-size: 17px;
        }

        .row {
            display: flex;

            justify-content:
                space-between;

            gap: 20px;

            margin-bottom: 9px;
        }

        .label {
            color: #d1d1d6;
        }

        .value {
            color: #0a84ff;

            font-family:
                Consolas,
                Monaco,
                monospace;

            text-align: right;

            overflow-wrap:
                anywhere;
        }

        .good {
            color: #30d158;
        }

        .warn {
            color: #ffd60a;
        }

        .bad {
            color: #ff453a;
        }

        .section {
            margin-top: 18px;
            margin-bottom: 8px;

            font-weight: bold;
        }

        #goldSymbols {
            height: 110px;

            padding: 9px;

            overflow-y: auto;

            background: #2c2c2e;

            border-radius: 5px;

            color: #d1d1d6;

            font-family:
                Consolas,
                Monaco,
                monospace;

            font-size: 11px;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }

        #log {
            height: 300px;

            padding: 9px;

            overflow-y: auto;

            background: #2c2c2e;

            border-radius: 5px;

            color: #d1d1d6;

            font-family:
                Consolas,
                Monaco,
                monospace;

            font-size: 11px;

            line-height: 1.5;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }

        .note {
            margin-top: 12px;

            color: #8e8e93;

            font-size: 11px;

            line-height: 1.4;
        }

    </style>

</head>


<body>


<div class="panel">


    <h1>
        cTrader Account + Symbol Test
    </h1>


    <div class="row">

        <span class="label">
            JavaScript:
        </span>

        <span
            id="javascriptStatus"
            class="value"
        >
            STARTING
        </span>

    </div>


    <div class="row">

        <span class="label">
            SDK:
        </span>

        <span
            id="sdkStatus"
            class="value"
        >
            --
        </span>

    </div>


    <div class="row">

        <span class="label">
            cTrader Host:
        </span>

        <span
            id="hostStatus"
            class="value"
        >
            --
        </span>

    </div>


    <div class="row">

        <span class="label">
            Account:
        </span>

        <span
            id="accountStatus"
            class="value"
        >
            --
        </span>

    </div>


    <div class="row">

        <span class="label">
            Symbol Count:
        </span>

        <span
            id="symbolCount"
            class="value"
        >
            --
        </span>

    </div>


    <div class="row">

        <span class="label">
            XAUUSD Symbol:
        </span>

        <span
            id="xauName"
            class="value"
        >
            --
        </span>

    </div>


    <div class="row">

        <span class="label">
            XAUUSD Symbol ID:
        </span>

        <span
            id="xauId"
            class="value"
        >
            --
        </span>

    </div>


    <div class="section">
        Gold-related symbols
    </div>


    <div id="goldSymbols">
        Waiting...
    </div>


    <div class="section">
        Log
    </div>


    <div id="log">
        Page loaded.
    </div>


    <div class="note">
        Account and symbol test only.
        No quotes, indicators or trading are enabled.
    </div>


</div>


<script type="module">


/*
============================================================
OFFICIAL CTRADER SDK IMPORTS

The important correction is sdk@0.0.9.
============================================================
*/


import {
    createClientAdapter
}
from
"https://esm.sh/@spotware-web-team/sdk-external-api@0.0.5";


import {
    getAccountInformation,
    getLightSymbolList,
    handleConfirmEvent,
    registerEvent
}
from
"https://esm.sh/@spotware-web-team/sdk@0.0.9";


import {
    take,
    tap,
    catchError,
    of
}
from
"https://esm.sh/rxjs@7.8.2";


import {
    createLogger
}
from
"https://esm.sh/@veksa/logger";


/*
============================================================
UI
============================================================
*/


const ui = {

    javascript:
        document.getElementById(
            "javascriptStatus"
        ),

    sdk:
        document.getElementById(
            "sdkStatus"
        ),

    host:
        document.getElementById(
            "hostStatus"
        ),

    account:
        document.getElementById(
            "accountStatus"
        ),

    symbolCount:
        document.getElementById(
            "symbolCount"
        ),

    xauName:
        document.getElementById(
            "xauName"
        ),

    xauId:
        document.getElementById(
            "xauId"
        ),

    goldSymbols:
        document.getElementById(
            "goldSymbols"
        ),

    log:
        document.getElementById(
            "log"
        )

};


/*
============================================================
UI HELPERS
============================================================
*/


function setStatus(
    element,
    value,
    type = ""
) {

    element.textContent =
        value;


    element.className =
        "value";


    if (type) {

        element.classList.add(
            type
        );

    }

}


function log(
    message,
    type = ""
) {

    const time =
        new Date()
            .toLocaleTimeString(
                "en-SG",
                {
                    hour12: false
                }
            );


    const row =
        document.createElement(
            "div"
        );


    row.textContent =
        `[${time}] ${message}`;


    if (type) {

        row.className =
            type;

    }


    ui.log.appendChild(
        row
    );


    ui.log.scrollTop =
        ui.log.scrollHeight;


    console.log(
        message
    );

}


function errorText(
    error
) {

    if (
        error === null ||
        error === undefined
    ) {

        return "Unknown error";

    }


    if (
        typeof error ===
        "string"
    ) {

        return error;

    }


    if (
        error.message
    ) {

        return error.message;

    }


    try {

        return JSON.stringify(
            error
        );

    }

    catch {

        return String(
            error
        );

    }

}


/*
============================================================
GLOBAL ERRORS
============================================================
*/


window.addEventListener(

    "error",

    event => {

        log(

            "JavaScript error: " +
            (
                event.message ||
                "Unknown error"
            ),

            "bad"

        );

    }

);


window.addEventListener(

    "unhandledrejection",

    event => {

        log(

            "Unhandled promise error: " +
            errorText(
                event.reason
            ),

            "bad"

        );

    }

);


/*
============================================================
JAVASCRIPT READY
============================================================
*/


setStatus(
    ui.javascript,
    "RUNNING",
    "good"
);


setStatus(
    ui.sdk,
    "LOADED",
    "good"
);


log(
    "JavaScript started.",
    "good"
);


log(
    "cTrader SDK 0.0.9 loaded.",
    "good"
);


/*
============================================================
RECURSIVE RESPONSE WALKER
============================================================
*/


function walkObject(
    value,
    callback,
    visited = new WeakSet(),
    depth = 0
) {

    if (
        value === null ||
        value === undefined ||
        typeof value !== "object" ||
        depth > 15
    ) {

        return;

    }


    if (
        visited.has(
            value
        )
    ) {

        return;

    }


    visited.add(
        value
    );


    callback(
        value
    );


    /*
    Some protobuf objects expose toObject().
    */


    if (
        typeof value.toObject ===
        "function"
    ) {

        try {

            const plain =
                value.toObject();


            if (
                plain &&
                plain !== value
            ) {

                walkObject(
                    plain,
                    callback,
                    visited,
                    depth + 1
                );

            }

        }

        catch {

            // ignore

        }

    }


    /*
    Arrays
    */


    if (
        Array.isArray(
            value
        )
    ) {

        for (
            const child
            of value
        ) {

            walkObject(
                child,
                callback,
                visited,
                depth + 1
            );

        }


        return;

    }


    /*
    Iterable protobuf repeated fields
    */


    if (
        typeof value[
            Symbol.iterator
        ] === "function"
        &&
        typeof value !==
            "string"
    ) {

        try {

            for (
                const child
                of value
            ) {

                walkObject(
                    child,
                    callback,
                    visited,
                    depth + 1
                );

            }

        }

        catch {

            // ignore

        }

    }


    /*
    Normal nested properties
    */


    for (
        const child
        of Object.values(
            value
        )
    ) {

        walkObject(
            child,
            callback,
            visited,
            depth + 1
        );

    }

}


/*
============================================================
ACCOUNT PARSER
============================================================
*/


function findAccountId(
    response
) {

    let accountId =
        null;


    walkObject(

        response,

        object => {


            if (
                accountId !== null
            ) {

                return;

            }


            const possibleId =

                object.login ??

                object.accountId ??

                object.ctidTraderAccountId ??

                object.traderId;


            if (
                possibleId !==
                undefined
                &&
                possibleId !==
                null
            ) {

                accountId =
                    possibleId;

            }

        }

    );


    return accountId;

}


/*
============================================================
SYMBOL PARSER
============================================================
*/


function extractSymbols(
    response
) {

    const symbols =
        [];


    const seen =
        new Set();


    walkObject(

        response,

        object => {


            const symbolId =

                object.symbolId ??

                object.id;


            const symbolName =

                object.symbolName ??

                object.name ??

                object.ticker;


            if (
                symbolId ===
                    undefined
                ||
                symbolId ===
                    null
                ||
                symbolName ===
                    undefined
                ||
                symbolName ===
                    null
            ) {

                return;

            }


            const normalizedName =
                String(
                    symbolName
                )
                .trim()
                .toUpperCase();


            /*
            Filter obvious non-symbol objects.
            */


            if (
                !normalizedName
                ||
                normalizedName.length >
                    40
            ) {

                return;

            }


            const key =
                `${symbolId}:${normalizedName}`;


            if (
                seen.has(
                    key
                )
            ) {

                return;

            }


            seen.add(
                key
            );


            symbols.push({

                id:
                    symbolId,

                name:
                    normalizedName,

                source:
                    object

            });

        }

    );


    return symbols;

}


/*
============================================================
LOAD ACCOUNT
============================================================
*/


function loadAccount(
    adapter
) {

    setStatus(
        ui.account,
        "LOADING",
        "warn"
    );


    log(
        "Requesting account information..."
    );


    getAccountInformation(
        adapter,
        {}
    )

    .pipe(

        take(1),

        tap(

            result => {


                console.log(
                    "ACCOUNT RESPONSE:",
                    result
                );


                const accountId =
                    findAccountId(
                        result
                    );


                if (
                    accountId ===
                    null
                ) {

                    setStatus(
                        ui.account,
                        "RESPONSE RECEIVED",
                        "warn"
                    );


                    log(
                        "Account response received, but account ID was not detected.",
                        "warn"
                    );


                    return;

                }


                setStatus(
                    ui.account,
                    String(
                        accountId
                    ),
                    "good"
                );


                log(

                    "Account loaded: " +
                    accountId,

                    "good"

                );

            }

        ),


        catchError(

            error => {


                setStatus(
                    ui.account,
                    "FAILED",
                    "bad"
                );


                log(

                    "Account request failed: " +
                    errorText(
                        error
                    ),

                    "bad"

                );


                return of(
                    null
                );

            }

        )

    )

    .subscribe();

}


/*
============================================================
LOAD SYMBOL LIST
============================================================
*/


function loadSymbols(
    adapter
) {

    setStatus(
        ui.symbolCount,
        "LOADING",
        "warn"
    );


    log(
        "Requesting available symbols..."
    );


    getLightSymbolList(
        adapter,
        {}
    )

    .pipe(

        take(1),

        tap(

            result => {


                console.log(
                    "SYMBOL RESPONSE:",
                    result
                );


                const symbols =
                    extractSymbols(
                        result
                    );


                setStatus(
                    ui.symbolCount,
                    String(
                        symbols.length
                    ),
                    symbols.length
                        ? "good"
                        : "warn"
                );


                log(

                    "Readable symbols detected: " +
                    symbols.length,

                    symbols.length
                        ? "good"
                        : "warn"

                );


                /*
                Find all possible Gold symbols.
                */


                const goldCandidates =
                    symbols
                    .filter(

                        symbol =>

                            symbol.name
                                .includes(
                                    "XAU"
                                )

                            ||

                            symbol.name
                                .includes(
                                    "GOLD"
                                )

                    );


                if (
                    goldCandidates.length
                ) {

                    ui.goldSymbols
                        .textContent =

                        goldCandidates
                        .map(

                            symbol =>
                                `${symbol.name}  |  ID ${symbol.id}`

                        )
                        .join(
                            "\n"
                        );

                }

                else {

                    ui.goldSymbols
                        .textContent =

                        "No XAU/GOLD symbols detected.";

                }


                /*
                Exact XAUUSD.
                */


                let selected =
                    symbols.find(

                        symbol =>
                            symbol.name ===
                            "XAUUSD"

                    );


                /*
                Suffix fallback:
                XAUUSD.c
                XAUUSDm
                XAUUSD-STD
                */


                if (
                    !selected
                ) {

                    selected =
                        symbols.find(

                            symbol =>
                                symbol.name
                                    .startsWith(
                                        "XAUUSD"
                                    )

                        );

                }


                /*
                General XAU fallback.
                */


                if (
                    !selected
                ) {

                    selected =
                        symbols.find(

                            symbol =>
                                symbol.name
                                    .includes(
                                        "XAU"
                                    )

                        );

                }


                /*
                GOLD fallback.
                */


                if (
                    !selected
                ) {

                    selected =
                        symbols.find(

                            symbol =>
                                symbol.name
                                    .includes(
                                        "GOLD"
                                    )

                        );

                }


                if (
                    !selected
                ) {

                    setStatus(
                        ui.xauName,
                        "NOT FOUND",
                        "bad"
                    );


                    setStatus(
                        ui.xauId,
                        "--",
                        "bad"
                    );


                    log(
                        "XAUUSD / Gold symbol was not found.",
                        "bad"
                    );


                    return;

                }


                setStatus(
                    ui.xauName,
                    selected.name,
                    "good"
                );


                setStatus(
                    ui.xauId,
                    String(
                        selected.id
                    ),
                    "good"
                );


                log(

                    "XAUUSD selected: " +
                    selected.name +
                    " | Symbol ID: " +
                    selected.id,

                    "good"

                );

            }

        ),


        catchError(

            error => {


                setStatus(
                    ui.symbolCount,
                    "FAILED",
                    "bad"
                );


                log(

                    "Symbol request failed: " +
                    errorText(
                        error
                    ),

                    "bad"

                );


                return of(
                    null
                );

            }

        )

    )

    .subscribe();

}


/*
============================================================
CREATE ADAPTER
============================================================
*/


let adapter;


try {

    const logger =
        createLogger(
            false
        );


    adapter =
        createClientAdapter({

            logger

        });


    log(
        "Client adapter created.",
        "good"
    );

}

catch (
    error
) {

    setStatus(
        ui.host,
        "ADAPTER FAILED",
        "bad"
    );


    log(

        "Adapter creation failed: " +
        errorText(
            error
        ),

        "bad"

    );

}


/*
============================================================
CTRADER CONNECTION
============================================================
*/


function connect() {

    if (
        !adapter
    ) {

        return;

    }


    setStatus(
        ui.host,
        "CONNECTING",
        "warn"
    );


    log(
        "Starting cTrader host connection..."
    );


    /*
    First confirmation.
    */


    handleConfirmEvent(
        adapter,
        {}
    )

    .pipe(
        take(1)
    )

    .subscribe({

        next:
            result => {

                console.log(
                    "INITIAL CONFIRM:",
                    result
                );


                log(
                    "Initial handshake confirmation received.",
                    "good"
                );

            },


        error:
            error => {

                log(

                    "Initial confirmation warning: " +
                    errorText(
                        error
                    ),

                    "warn"

                );

            }

    });


    /*
    Wait for host registration.
    */


    log(
        "Waiting for cTrader registration..."
    );


    registerEvent(
        adapter
    )

    .pipe(

        take(1),

        tap(

            registration => {


                console.log(
                    "REGISTRATION:",
                    registration
                );


                log(
                    "Host registration received.",
                    "good"
                );


                /*
                Second confirmation.
                */


                handleConfirmEvent(
                    adapter,
                    {}
                )

                .pipe(
                    take(1)
                )

                .subscribe({

                    next:
                        confirmation => {


                            console.log(
                                "SECOND CONFIRM:",
                                confirmation
                            );


                            setStatus(
                                ui.host,
                                "CONNECTED",
                                "good"
                            );


                            log(
                                "CTRADER CONNECTION ESTABLISHED.",
                                "good"
                            );


                            /*
                            Only now request account
                            and symbol information.
                            */


                            loadAccount(
                                adapter
                            );


                            loadSymbols(
                                adapter
                            );

                        },


                    error:
                        error => {


                            setStatus(
                                ui.host,
                                "CONFIRM FAILED",
                                "bad"
                            );


                            log(

                                "Second confirmation failed: " +
                                errorText(
                                    error
                                ),

                                "bad"

                            );

                        }

                });

            }

        ),


        catchError(

            error => {


                setStatus(
                    ui.host,
                    "FAILED",
                    "bad"
                );


                log(

                    "Host registration failed: " +
                    errorText(
                        error
                    ),

                    "bad"

                );


                return of(
                    null
                );

            }

        )

    )

    .subscribe();

}


/*
============================================================
START
============================================================
*/


connect();


</script>


</body>

</html>
