<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Price Move $5 + Stochastic Filter</title>
    <style>
        body { background-color: #1c1c1e; color: #ffffff; font-family: sans-serif; padding: 15px; margin: 0; font-size: 13px; }
        .header { font-weight: 600; margin-bottom: 12px; color: #34c759; border-bottom: 1px solid #2c2c2e; padding-bottom: 6px; }
        .metric-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .metric-value { font-family: monospace; color: #0a84ff; }
        .log-box { margin-top: 12px; background: #2c2c2e; border-radius: 4px; padding: 8px; height: 120px; overflow-y: auto; font-family: monospace; font-size: 11px; color: #a9a9a9; }
        .btn { width: 100%; padding: 10px; margin-top: 10px; background: #34c759; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn:active { background: #248a3d; }
    </style>
</head>
<body>

    <div class="header">Strategy: Price Move & Stoch Filter</div>
    <div class="metric-row">
        <span>Target Symbol:</span>
        <span class="metric-value" id="ui-symbol">XAUUSD</span>
    </div>
    <div class="metric-row">
        <span>Ref Price:</span>
        <span class="metric-value" id="ui-ref">--</span>
    </div>
    <div class="metric-row">
        <span>Current Stoch K:</span>
        <span class="metric-value" id="ui-stoch">--</span>
    </div>
    
    <button class="btn" id="startBtn">Start Automated Strategy</button>
    <div class="log-box" id="log">System Ready. Click the button above to run.</div>

    <script>
        const CONFIG = { move: 10.0, profit: 7.0, stop: 7.0, lotSize: 0.01, maxOpen: 1 };
        let referencePrice = null;
        const stochPeriod = 14;
        const stochSlowing = 3;
        let priceHistory = []; 

        function logMessage(msg) {
            const box = document.getElementById('log');
            box.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function calculateStochK(currentClose) {
            priceHistory.push(currentClose);
            if (priceHistory.length > stochPeriod + stochSlowing) priceHistory.shift();
            if (priceHistory.length < stochPeriod) return null;

            let rawKValues = [];
            for (let i = 0; i <= priceHistory.length - stochPeriod; i++) {
                const window = priceHistory.slice(i, i + stochPeriod);
                const currentLow = Math.min(...window);
                const currentHigh = Math.max(...window);
                const currentCloseVal = window[window.length - 1];
                const rawK = currentHigh === currentLow ? 50 : ((currentCloseVal - currentLow) / (currentHigh - currentLow)) * 100;
                rawKValues.push(rawK);
            }
            const targetWindow = rawKValues.slice(-stochSlowing);
            return targetWindow.reduce((a, b) => a + b, 0) / stochSlowing;
        }

        function startStrategyPipeline(apiContext) {
            logMessage("Connecting to market data feed...");
            const symbol = "XAUUSD";

            apiContext.marketData.subscribeTicks({ symbol: symbol }, (tick) => {
                const currentPrice = tick.close;
                
                if (!referencePrice) {
                    referencePrice = currentPrice;
                    document.getElementById('ui-ref').innerText = referencePrice.toFixed(2);
                    logMessage(`Initial Reference Price set: $${referencePrice.toFixed(2)}`);
                }

                const stochK = calculateStochK(currentPrice);
                if (stochK !== null) {
                    document.getElementById('ui-stoch').innerText = stochK.toFixed(2);
                }

                // Singapore 20:00-24:00 window check = UTC 12:00-16:00
                const currentUtcHour = new Date().getUTCHours();
                const isTradeTime = currentUtcHour >= 12 && currentUtcHour < 16;

                const buyOk = stochK !== null && stochK > 80;
                const sellOk = stochK !== null && stochK < 20;

                apiContext.trading.getPositions().then(positions => {
                    const activePositionCount = positions.filter(p => p.symbol === symbol).length;
                    const inPosition = activePositionCount >= CONFIG.maxOpen;

                    if (isTradeTime && !inPosition && stochK !== null) {
                        
                        // LONG Rule Evaluation
                        if (buyOk && currentPrice <= (referencePrice - CONFIG.move)) {
                            logMessage(`BUY Condition Triggered! Entry: ${currentPrice}`);
                            apiContext.trading.placeMarketOrder({
                                symbol: symbol, volume: CONFIG.lotSize * 100000, direction: 'Buy',
                                stopLoss: currentPrice - CONFIG.stop, takeProfit: currentPrice + CONFIG.profit
                            }).then(() => {
                                referencePrice = currentPrice;
                                document.getElementById('ui-ref').innerText = referencePrice.toFixed(2);
                            }).catch(err => logMessage(`Order Error: ${err.message}`));
                        }

                        // SHORT Rule Evaluation
                        if (sellOk && currentPrice >= (referencePrice + CONFIG.move)) {
                            logMessage(`SHORT Condition Triggered! Entry: ${currentPrice}`);
                            apiContext.trading.placeMarketOrder({
                                symbol: symbol, volume: CONFIG.lotSize * 100000, direction: 'Sell',
                                stopLoss: currentPrice + CONFIG.stop, takeProfit: currentPrice - CONFIG.profit
                            }).then(() => {
                                referencePrice = currentPrice;
                                document.getElementById('ui-ref').innerText = referencePrice.toFixed(2);
                            }).catch(err => logMessage(`Order Error: ${err.message}`));
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
