<script type="module">

/*
============================================================
CTRADER PLUGIN DIAGNOSTIC
============================================================

This version DOES NOT:
- place trades
- subscribe to XAUUSD
- calculate Stochastic
- change positions

It only diagnoses the cTrader Plugin SDK connection.
============================================================
*/

const logBox = document.getElementById("log");
const connectionUi = document.getElementById("connection");
const accountUi = document.getElementById("account");
const symbolIdUi = document.getElementById("symbolId");
const bidUi = document.getElementById("bid");
const askUi = document.getElementById("ask");


/*
============================================================
LOGGING
============================================================
*/

function log(message, type = "normal") {

    const time =
        new Date().toLocaleTimeString(
            "en-SG",
            {
                hour12: false
            }
        );

    const text =
        `[${time}] ${message}`;

    console.log(text);

    if (!logBox) {
        return;
    }

    const row =
        document.createElement("div");

    row.textContent =
        text;

    if (type === "success") {

        row.style.color =
            "#30d158";

    } else if (type === "warning") {

        row.style.color =
            "#ffd60a";

    } else if (type === "error") {

        row.style.color =
            "#ff453a";

    } else {

        row.style.color =
            "#d1d1d6";
    }

    logBox.appendChild(row);

    logBox.scrollTop =
        logBox.scrollHeight;
}


function formatError(error) {

    if (!error) {

        return "Unknown error";
    }

    if (typeof error === "string") {

        return error;
    }

    if (error.message) {

        return error.message;
    }

    try {

        return JSON.stringify(error);

    } catch {

        return String(error);
    }
}


/*
============================================================
GLOBAL ERROR HANDLERS
============================================================
*/

window.addEventListener(
    "error",
    event => {

        log(
            "GLOBAL JS ERROR: " +
            (
                event.message ||
                "Unknown JavaScript error"
            ),
            "error"
        );

        console.error(
            "Full window.error event:",
            event
        );
    }
);


window.addEventListener(
    "unhandledrejection",
    event => {

        log(
            "UNHANDLED PROMISE: " +
            formatError(event.reason),
            "error"
        );

        console.error(
            "Full rejection:",
            event.reason
        );
    }
);


/*
============================================================
RESET SCREEN FOR DIAGNOSTIC
============================================================
*/

if (connectionUi) {
    connectionUi.textContent =
        "Diagnostic...";
}

if (accountUi) {
    accountUi.textContent =
        "--";
}

if (symbolIdUi) {
    symbolIdUi.textContent =
        "--";
}

if (bidUi) {
    bidUi.textContent =
        "--";
}

if (askUi) {
    askUi.textContent =
        "--";
}


log(
    "================================"
);

log(
    "cTrader diagnostic started."
);

log(
    "JavaScript module is running.",
    "success"
);


/*
============================================================
STEP 1
LOAD EXTERNAL API
============================================================
*/

let externalApi;

try {

    log(
        "STEP 1: Loading sdk-external-api..."
    );

    externalApi =
        await import(
            "https://esm.sh/@spotware-web-team/sdk-external-api@0.0.5"
        );

    log(
        "sdk-external-api loaded.",
        "success"
    );

    console.log(
        "EXTERNAL API MODULE:",
        externalApi
    );

    console.log(
        "EXTERNAL API EXPORTS:",
        Object.keys(
            externalApi
        ).sort()
    );

    log(
        "External API exports: " +
        Object.keys(
            externalApi
        )
        .sort()
        .join(", ")
    );

} catch (error) {

    log(
        "STEP 1 FAILED: " +
        formatError(error),
        "error"
    );

    console.error(
        "External API import failure:",
        error
    );

    throw error;
}


/*
============================================================
STEP 2
LOAD MAIN CTRADER SDK
============================================================
*/

let sdk;

try {

    log(
        "STEP 2: Loading main cTrader SDK..."
    );

    sdk =
        await import(
            "https://esm.sh/@spotware-web-team/sdk"
        );

    log(
        "Main cTrader SDK loaded.",
        "success"
    );

    const exports =
        Object.keys(
            sdk
        ).sort();

    console.log(
        "CTRADER SDK MODULE:",
        sdk
    );

    console.log(
        "CTRADER SDK EXPORTS:",
        exports
    );

    log(
        "SDK export count: " +
        exports.length,
        "success"
    );

    /*
    Print all export names into the page.

    This is especially important because your
    npm build previously reported missing exports.
    */

    log(
        "SDK exports:"
    );

    exports.forEach(
        name => {

            log(
                " • " + name
            );
        }
    );

} catch (error) {

    log(
        "STEP 2 FAILED: " +
        formatError(error),
        "error"
    );

    console.error(
        "Main SDK import failure:",
        error
    );

    throw error;
}


/*
============================================================
STEP 3
CHECK REQUIRED FUNCTIONS
============================================================
*/

log(
    "STEP 3: Checking SDK functions..."
);


const requiredFunctions = [

    "registerEvent",

    "handleConfirmEvent",

    "getAccountInformation",

    "getLightSymbolList",

    "getSymbol",

    "subscribeQuotes",

    "quoteEvent",

    "unsubscribeQuotes"
];


for (
    const name
    of requiredFunctions
) {

    const exists =
        typeof sdk[name]
        ===
        "function";

    log(
        name +
        ": " +
        (
            exists
                ? "FOUND"
                : "MISSING"
        ),
        exists
            ? "success"
            : "error"
    );
}


/*
============================================================
STEP 4
CHECK EXTERNAL ADAPTER
============================================================
*/

log(
    "STEP 4: Checking createClientAdapter..."
);


if (
    typeof externalApi.createClientAdapter
    !==
    "function"
) {

    log(
        "createClientAdapter: MISSING",
        "error"
    );

    throw new Error(
        "createClientAdapter is not exported."
    );
}


log(
    "createClientAdapter: FOUND",
    "success"
);


/*
============================================================
STEP 5
CREATE MINIMAL LOGGER
============================================================

Using a minimal logger here avoids introducing
another dependency while diagnosing the connection.
============================================================
*/

const diagnosticLogger = {

    debug: (...args) =>
        console.debug(
            "[cTrader DEBUG]",
            ...args
        ),

    info: (...args) =>
        console.info(
            "[cTrader INFO]",
            ...args
        ),

    warn: (...args) =>
        console.warn(
            "[cTrader WARN]",
            ...args
        ),

    error: (...args) =>
        console.error(
            "[cTrader ERROR]",
            ...args
        )
};


/*
============================================================
STEP 6
CREATE ADAPTER
============================================================
*/

let adapter;

try {

    log(
        "STEP 5: Creating client adapter..."
    );

    adapter =
        externalApi.createClientAdapter(
            {
                logger:
                    diagnosticLogger
            }
        );

    console.log(
        "CREATED ADAPTER:",
        adapter
    );

    log(
        "Client adapter created.",
        "success"
    );

} catch (error) {

    log(
        "ADAPTER CREATION FAILED: " +
        formatError(error),
        "error"
    );

    console.error(
        "Adapter creation error:",
        error
    );

    throw error;
}


/*
============================================================
STEP 7
VERIFY HANDSHAKE FUNCTIONS BEFORE CALLING THEM
============================================================
*/

if (
    typeof sdk.registerEvent
    !==
    "function"
) {

    log(
        "STOPPING: registerEvent is not available.",
        "error"
    );

    log(
        "The SDK export list above tells us which API this package actually provides.",
        "warning"
    );

    if (connectionUi) {

        connectionUi.textContent =
            "SDK mismatch";
    }

} else if (
    typeof sdk.handleConfirmEvent
    !==
    "function"
) {

    log(
        "STOPPING: handleConfirmEvent is not available.",
        "error"
    );

    if (connectionUi) {

        connectionUi.textContent =
            "SDK mismatch";
    }

} else {

    /*
    ========================================================
    STEP 8
    REGISTER WITH CTRADER HOST
    ========================================================
    */

    log(
        "STEP 6: Waiting for cTrader registerEvent..."
    );


    try {

        const registration$ =
            sdk.registerEvent(
                adapter
            );


        console.log(
            "registerEvent observable:",
            registration$
        );


        const registrationSubscription =
            registration$
            .subscribe({

                next: value => {

                    console.log(
                        "REGISTER EVENT RECEIVED:",
                        value
                    );


                    log(
                        "REGISTER EVENT RECEIVED.",
                        "success"
                    );


                    log(
                        "Registration payload written to browser console."
                    );


                    if (connectionUi) {

                        connectionUi.textContent =
                            "Host detected";

                        connectionUi.style.color =
                            "#30d158";
                    }


                    /*
                    ============================================
                    CONFIRM HOST EVENT
                    ============================================
                    */

                    try {

                        log(
                            "STEP 7: Sending/handling confirmation..."
                        );


                        const confirm$ =
                            sdk.handleConfirmEvent(
                                adapter,
                                {}
                            );


                        console.log(
                            "Confirmation observable:",
                            confirm$
                        );


                        confirm$
                        .subscribe({

                            next:
                                confirmation => {

                                    console.log(
                                        "CONFIRMATION RECEIVED:",
                                        confirmation
                                    );


                                    log(
                                        "CTRADER HANDSHAKE SUCCESS.",
                                        "success"
                                    );


                                    if (
                                        connectionUi
                                    ) {

                                        connectionUi
                                            .textContent =
                                            "Connected";

                                        connectionUi
                                            .style
                                            .color =
                                            "#30d158";
                                    }
                                },


                            error:
                                error => {

                                    log(
                                        "CONFIRM ERROR: " +
                                        formatError(
                                            error
                                        ),
                                        "error"
                                    );


                                    console.error(
                                        "Confirmation error:",
                                        error
                                    );
                                }
                        });


                    } catch (error) {

                        log(
                            "CONFIRM CALL FAILED: " +
                            formatError(error),
                            "error"
                        );


                        console.error(
                            "Confirm call failure:",
                            error
                        );
                    }
                },


                error: error => {

                    log(
                        "REGISTER EVENT ERROR: " +
                        formatError(error),
                        "error"
                    );


                    console.error(
                        "registerEvent failure:",
                        error
                    );


                    if (
                        connectionUi
                    ) {

                        connectionUi.textContent =
                            "Registration failed";

                        connectionUi.style.color =
                            "#ff453a";
                    }
                },


                complete: () => {

                    log(
                        "registerEvent stream completed."
                    );
                }
            });


        console.log(
            "Registration subscription:",
            registrationSubscription
        );


    } catch (error) {

        log(
            "registerEvent CALL FAILED: " +
            formatError(error),
            "error"
        );


        console.error(
            "registerEvent call error:",
            error
        );


        if (
            connectionUi
        ) {

            connectionUi.textContent =
                "Registration error";

            connectionUi.style.color =
                "#ff453a";
        }
    }
}


/*
============================================================
FINAL DIAGNOSTIC MESSAGE
============================================================
*/

log(
    "================================"
);

log(
    "Diagnostic setup complete."
);

log(
    "If the page stops at 'Waiting for cTrader registerEvent', the SDK loaded but no registration event has reached the page.",
    "warning"
);

</script>
